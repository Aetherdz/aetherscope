[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherscope"
version = "1.0.0"
description = "Enforce authorized testing scope: parse scope rules, validate targets, and filter target lists."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Aether-DZ", email = "aether@users.noreply.github.com" }
]
keywords = ["security", "bugbounty", "scope", "recon", "authorisation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Aether-DZ/aetherscope"
Repository = "https://github.com/Aether-DZ/aetherscope"
Documentation = "https://aether-dz.github.io/aetherscope/"
Issues = "https://github.com/Aether-DZ/aetherscope/issues"

[project.scripts]
aetherscope = "aetherscope.cli:main"

[tool.setuptools]
packages = ["aetherscope"]

[tool.ruff]
line-length = 92
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]